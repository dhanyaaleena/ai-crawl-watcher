name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholders: the build only needs these to be set; no request reaches them.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: Tracking pipeline + row level security (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Database, auth, API gateway and the edge runtime (which serves the `track` function); the rest isn't needed.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - name: Write .env.local from the local stack
        run: |
          npx supabase status -o env > status.env
          set -a; . ./status.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local
          rm status.env
      - run: npm run seed:demo
      - run: npm run smoke
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
